name: Build and push codedoodles image

on:
  push:
    branches: [master, feat/containerize]
    paths-ignore:
      - .github/FUNDING.yml
      - README.md
  pull_request:
    branches: [master]
    paths-ignore:
      - .github/FUNDING.yml
      - README.md
    types: [opened, reopened, synchronize]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      REPO: codedoodles
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Build image
        uses: docker/build-push-action@eb6512707bea5740b2608f2a43ece7bc543cb75b  # v7.0.0
        with:
          context: .
          cache-from: |
            type=gha,scope=${{ github.ref_name }}
            type=gha,scope=master
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository_owner }}/codedoodles:latest
          load: true
          push: false

      - name: Tag and push image
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/publish
        with:
          candidate-ref: ghcr.io/${{ github.repository_owner }}/codedoodles:latest
          refs: |
            ghcr.io/${{ github.repository_owner }}/codedoodles:latest
            forgejo.treyturner.info/${{ github.repository_owner }}/codedoodles:latest
          github-token: ${{ github.token }}
          forgejo-token: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
